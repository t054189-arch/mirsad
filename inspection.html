    <span class="topbar__mark" aria-hidden="true">
      <svg viewBox="0 0 100 52" width="30" height="16">

          <path d="M50 5 C 76 5, 94 20, 94 48"/><path d="M50 5 C 70 5, 80 22, 80 48"/>
          <path d="M50 5 C 62 6, 66 24, 66 48"/><path d="M50 5 V48"/>
          <path d="M50 5 C 38 6, 34 24, 34 48"/><path d="M50 5 C 30 5, 20 22, 20 48"/>
          <path d="M50 5 C 24 5, 6 20, 6 48"/>
        </g>
      </svg>
    </span>
    <span class="topbar__lock">
      <span class="topbar__ar" data-i18n="brand.name">مرصاد</span>
      <span class="topbar__en" data-i18n="brand.sub">MIRSAAD</span>
    </span>
  </a>

  <h1 class="topbar__page" data-i18n="sc.data">فحص جديد</h1>

  <div class="topbar__tools">
    <span class="who" id="whoAmI" title=""><i aria-hidden="true"></i><b></b><em class="who__role"></em></span>

    <button class="iconbtn" id="langBtn" data-i18n-attr="aria-label:a11y.lang" aria-label="التبديل إلى الإنجليزية">
      <span id="langLabel">EN</span>
    </button>

    <button class="iconbtn" id="modeBtn" data-i18n-attr="aria-label:a11y.mode" aria-label="تبديل الوضع الفاتح والداكن">
      <svg class="ico ico--sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <svg class="ico ico--moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="iconbtn" id="outBtn" data-i18n-attr="aria-label:a.logout" aria-label="تسجيل الخروج">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M15 5.5V4a1.5 1.5 0 0 0-1.5-1.5h-8A1.5 1.5 0 0 0 4 4v16a1.5 1.5 0 0 0 1.5 1.5h8A1.5 1.5 0 0 0 15 20v-1.5"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M9.5 12h11m0 0-3.2-3.2M20.5 12l-3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

    <button class="navtoggle" id="sideToggle" data-i18n-attr="aria-label:a11y.menu" aria-label="فتح القائمة" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="sidenav" id="sidenav" aria-label="أقسام مرصاد">
      <a class="sidenav__item" href="app.html#/dashboard"><i aria-hidden="true"></i><span data-i18n="sd.board">لوحة التحكم</span></a>
      <a class="sidenav__item" href="home.html"><i aria-hidden="true"></i><span data-i18n="sd.home">نظرة عامة</span></a>
      <a class="sidenav__item" href="structures.html"><i aria-hidden="true"></i><span data-i18n="sd.assets">المنشآت</span></a>
      <a class="sidenav__item is-on" href="inspection.html" aria-current="page"><i aria-hidden="true"></i><span data-i18n="sd.insp">فحص جديد</span></a>
      <a class="sidenav__item" href="analysis.html"><i aria-hidden="true"></i><span data-i18n="sd.analysis">التحليل</span></a>
      <a class="sidenav__item" href="results.html"><i aria-hidden="true"></i><span data-i18n="sd.results">النتائج</span></a>
      <a class="sidenav__item" href="review.html"><i aria-hidden="true"></i><span data-i18n="sd.review">المراجعة</span></a>
      <a class="sidenav__item" href="record.html"><i aria-hidden="true"></i><span data-i18n="sd.rep">السجلات</span></a>
      <a class="sidenav__item" href="alerts.html"><i aria-hidden="true"></i><span data-i18n="sd.alerts">الإشعارات</span></a>
      <a class="sidenav__item" href="about.html"><i aria-hidden="true"></i><span data-i18n="sd.about">عن المشروع</span></a>
  </nav>

  <main class="page" id="page">
<p class="page__lead" data-i18n="pg.inspLead">أدخل بيانات الزيارة الميدانية، ثم ارفع صور الفحص وتقاريره.</p>

<div class="panes">
  <section class="pane">
    <h2 class="pane__h" data-i18n="m3.a">البيانات الأساسية</h2>

    <div class="field">
      <label for="inspAsset" data-i18n="m3.d">المنشأة</label>
      <select id="inspAsset" name="asset" aria-describedby="inspAssetErr" required>
        <option value="" data-i18n="a.pickAsset">اختر المنشأة…</option>
        <option value="jaber"   data-i18n="m2.b">جسر جابر</option>
        <option value="office"  data-i18n="m2.d">مبنى إداري</option>
        <option value="highway" data-i18n="m2.f">طريق سريع</option>
      </select>
      <p class="field__err" id="inspAssetErr" role="alert"></p>
    </div>

    <div class="field">
      <label for="inspDate" data-i18n="m3.e">تاريخ الفحص</label>
      <input type="date" id="inspDate" name="date" aria-describedby="inspDateErr" required />
      <p class="field__err" id="inspDateErr" role="alert"></p>
    </div>

    <div class="field">
      <label for="inspType" data-i18n="m3.f">نوع الفحص</label>
      <select id="inspType" name="type" aria-describedby="inspTypeErr" required>
        <option value="" data-i18n="a.pickType">اختر نوع الفحص…</option>
        <option value="routine"   data-i18n="m3.g">فحص دوري</option>
        <option value="initial"   data-i18n="a.typeFirst">فحص أولي</option>
        <option value="follow"    data-i18n="a.typeFollow">فحص متابعة</option>
        <option value="urgent"    data-i18n="a.typeUrgent">فحص طارئ</option>
        <option value="post"      data-i18n="a.typeAfter">فحص بعد إصلاح</option>
      </select>
      <p class="field__err" id="inspTypeErr" role="alert"></p>
    </div>

    <div class="field">
      <label for="inspStaff" data-i18n="a.engineer">الموظف المسؤول</label>
      <input type="text" id="inspStaff" name="staff" autocomplete="name"
             aria-describedby="inspStaffErr"
             data-i18n-attr="placeholder:a.staffHint" placeholder="اسم الموظف الذي أجرى الزيارة" required />
      <p class="field__err" id="inspStaffErr" role="alert"></p>
    </div>

    <div class="field">
      <label for="inspSection" data-i18n="a.section">القطاع</label>
      <select id="inspSection" name="section" aria-describedby="inspSectionErr" required>
        <option value="" data-i18n="a.pickSection">اختر القطاع المفحوص…</option>
        <option value="piers"  data-i18n="a.sectionV">الركائز والسطح السفلي</option>
        <option value="deck"   data-i18n="a.sectionDeck">سطح الجسر والتبليط</option>
        <option value="joints" data-i18n="a.sectionJoints">الفواصل والمساند</option>
        <option value="rails"  data-i18n="a.sectionRails">الحواجز والدرابزين</option>
        <option value="whole"  data-i18n="a.sectionAll">المنشأة كاملة</option>
      </select>
      <p class="field__err" id="inspSectionErr" role="alert"></p>
    </div>

    <div class="field">
      <label for="inspNotes" data-i18n="a.notesLabel">ملاحظات ميدانية</label>
      <textarea id="inspNotes" name="notes" rows="3"
                data-i18n-attr="placeholder:a.notes" placeholder="ملاحظات ميدانية…"></textarea>
      <p class="field__hint" data-i18n="a.notesHint">اختيارية — اكتب ما لا تُظهره الصور.</p>
    </div>
  </section>

  <section class="pane">
    <h2 class="pane__h" data-i18n="sc.upload">رفع الملفات</h2>

    <input class="drop__in" type="file" id="inspFiles" name="files" multiple
           accept="image/jpeg,image/png,application/pdf" aria-describedby="inspFilesErr" />
    <label class="drop" id="inspDrop" for="inspFiles">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 16V5m0 0L8 9m4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="m4.c">اسحب الملفات هنا أو اضغط للاختيار</span>
      <small>JPG · PNG · PDF</small>
    </label>

    <div class="files" id="inspFileList"></div>
    <p class="field__hint" id="inspFilesNone" data-i18n="a.noFiles">لم تُرفع ملفات بعد.</p>
    <p class="field__err" id="inspFilesErr" role="alert"></p>
  </section>
</div>

<a class="ui ui--go page__go" id="inspGo" href="analysis.html" data-i18n="a.startAnalysis">بدء التحليل</a>

  </main>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/chrome.js"></script>
</body>
</html>
