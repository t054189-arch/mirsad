<!DOCTYPE html>
<html lang="ar" dir="rtl" data-mode="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول — مِرصاد · MIRSAAD</title>
<meta name="description" content="مرصاد — منصة ذكية وآمنة لإدارة دورة فحص المنشآت للمكاتب الهندسية." />
<meta name="theme-color" content="#181613" />
<script src="assets/boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body class="gate">

<canvas class="scene" id="scene" aria-hidden="true"></canvas>
<div class="blueprint" aria-hidden="true"></div>
<div class="dawnglow" aria-hidden="true"></div>

<div class="gate__tools">
  <button class="iconbtn" id="langBtn" data-i18n-attr="aria-label:a11y.lang" aria-label="التبديل إلى الإنجليزية">
    <span id="langLabel">EN</span>
  </button>
  <button class="iconbtn" id="modeBtn" data-i18n-attr="aria-label:a11y.mode" aria-label="تبديل الوضع الفاتح والداكن">
    <svg class="ico ico--sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <svg class="ico ico--moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
      <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<main class="gate__wrap">
  <section class="gate__brand">
    <svg class="gate__dome" viewBox="0 0 100 52" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M50 5 C 76 5, 94 20, 94 48"/><path d="M50 5 C 70 5, 80 22, 80 48"/>
        <path d="M50 5 C 62 6, 66 24, 66 48"/><path d="M50 5 V48"/>
        <path d="M50 5 C 38 6, 34 24, 34 48"/><path d="M50 5 C 30 5, 20 22, 20 48"/>
        <path d="M50 5 C 24 5, 6 20, 6 48"/>
      </g>
    </svg>
    <p class="gate__ar">مرصاد</p>
    <p class="gate__en">MIRSAAD</p>
    <p class="gate__tag" data-i18n="hero.tag">نفحص اليوم .. لنبني غدًا أكثر أمانًا</p>
    <p class="gate__tagen">SAFER STRUCTURES &nbsp;·&nbsp; BRIGHTER TOMORROW</p>
  </section>

  <section class="gate__card">
    <h2 data-i18n="a.welcome">مرحبًا بعودتك</h2>
    <p class="gate__sub" data-i18n="a.welcomeSub">سجّل دخولك لمتابعة فحوصات منشآتك.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email" data-i18n="a.email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email" inputmode="email"
               autocomplete="email" spellcheck="false"
               placeholder="name@company.com" aria-describedby="emailErr" required />
        <p class="field__err" id="emailErr" role="alert"></p>
      </div>

      <div class="field">
        <label for="pass" data-i18n="a.pass">كلمة المرور</label>
        <input id="pass" name="password" type="password"
               autocomplete="current-password" minlength="8"
               placeholder="••••••••" aria-describedby="passErr" required />
        <p class="field__err" id="passErr" role="alert"></p>
      </div>

      <label class="remember" for="remember">
        <input type="checkbox" id="remember" name="remember" />
        <span data-i18n="a.remember">تذكرني</span>
      </label>

      <button class="ui ui--go" type="submit" data-i18n="sc.signin">تسجيل الدخول</button>
    </form>

    <div class="demo">
      <p class="demo__h" data-i18n="a.demoH">الحساب التجريبي</p>
      <div class="demo__row"><span data-i18n="a.email">البريد الإلكتروني</span><code>staff@mirsaad.kw</code></div>
      <div class="demo__row"><span data-i18n="a.pass">كلمة المرور</span><code>mirsaad2026</code></div>
      <button class="ui ui--ghost demo__btn" type="button" id="demoBtn" data-i18n="a.demoGo">الدخول بالحساب التجريبي</button>
    </div>

    <p class="gate__note" data-i18n="a.demoNote">
      نموذج عرض: التحقق يجري في المتصفح لا على خادم، والجلسة تُحفظ في متصفحك وحده.
    </p>
  </section>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/scene.js"></script>
<script src="assets/chrome.js"></script>
<script src="assets/auth.js"></script>
</body>
</html>
