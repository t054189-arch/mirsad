<!-- لوحة التحكم تعمل داخل قشرة الموقع نفسها لا في موقع ثانٍ:
     شريطٌ علويّ واحد، وقائمةٌ جانبية واحدة، وبوابة دخول واحدة.
     الحزمة تُركّب نفسها في #root، وقشرتها الخاصة تُخفى — انظر
     assets/board.css و assets/board.js. -->
<div id="root"></div>

<script>
  /* الحزمة تقرأ مسارها من ‎location.hash‎. وبلا مسار تفتح صفحتها
     التعريفية — وهي تُرسم داخل قشرة اللوحة، فتبدو صفحتان في شاشة
     واحدة. فيُثبَّت المسار قبل أن تُحمّل الحزمة، بلا إعادة تحميل. */
  if (!location.hash) history.replaceState(null, '', location.pathname + '#/dashboard');
</script>

<script src="app.js"></script>
<script src="ux.js"></script>
<script src="assets/board.js"></script>
